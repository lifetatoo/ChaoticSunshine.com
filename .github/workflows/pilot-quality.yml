name: Pilot source and download QA
on:
  pull_request:
  push:
    branches:
      - design/illustrated-launch-review-2026-11-13
      - integration/chaotic-sunshine-2026-11-16
  workflow_dispatch:
jobs:
  source-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out pilot
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Cloudflare static site
        run: npm run build
      - name: Validate navigation, metadata, assets, newsletters and guide outputs
        run: npm run test:ci
      - name: Install headless browser test libraries
        run: npm install --no-save --no-package-lock playwright@1.56.1 axe-core@4.10.3
      - name: Verify actual page layout and accessibility
        run: node qa/check-browser-ci.cjs
      - name: Exercise end-to-end user journeys without sending live Kit emails
        run: node qa/check-user-journeys.cjs
      - name: Verify review build indexing isolation
        run: |
          npm run build:staging
          CS_STAGING=1 npm test
      - name: Observe public domain status without changing production
        if: always()
        shell: bash
        run: |
          for host in https://chaoticsunshine.com/ https://www.chaoticsunshine.com/; do
            echo "DOMAIN_CHECK $host"
            curl --connect-timeout 6 --max-time 12 -sSI -L "$host" | grep -Ei '^(HTTP/|location:|x-robots-tag:|server:|cache-control:)' | tail -15 || true
          done
      - name: Save rendered visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaotic-sunshine-visual-qa
          path: |
            qa/screenshots-ci
            qa/user-journey-results.json
          if-no-files-found: warn
          retention-days: 7
